name: CI

# `pull_request` only. Adding `push` as well ran the whole suite twice on every
# commit to a branch with an open PR. Deduplicating those into one concurrency
# group stopped the double spend, but the cancelled run stayed attached to the
# pull request as a non-passing check, so every PR reported UNSTABLE with
# nothing actually wrong. Not starting the second run is the better fix.
#
# The trade is that a branch pushed without a PR gets no CI. Opening the PR is
# what asks for review, and that is when the answer matters.
on:
  pull_request:

# Read-only by default; no job here needs more.
permissions:
  contents: read

# Still worth grouping: pushing again mid-suite should abandon a run that is now
# testing a commit nobody cares about.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npm test
      - run: npm run build
        env:
          DEVELOPMENT_BUILD: ${{ github.sha }}

  # Kept separate from `test` so a browser failure is distinguishable at a
  # glance from a unit failure, and so the fast suite still reports when the
  # browser download or the dev server is what broke.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Build both images without pushing. rollup.config.js reaches into dev/, and
  # .dockerignore allowlists what the build stage may COPY, so a new top-level
  # directory that is missing from the allowlist builds fine locally and only
  # fails in the image build. Catch that on the PR rather than at release time.
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: alpine, file: ./Dockerfile }
          - { name: debian, file: ./debian.dockerfile }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.name }} (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
          push: false
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}
