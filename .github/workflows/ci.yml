name: CI

# `pull_request` only. Adding `push` as well ran the whole suite twice on every
# commit to a branch with an open PR. Deduplicating those into one concurrency
# group stopped the double spend, but the cancelled run stayed attached to the
# pull request as a non-passing check, so every PR reported UNSTABLE with
# nothing actually wrong. Not starting the second run is the better fix.
#
# The trade is that a branch pushed without a PR gets no CI. Opening the PR is
# what asks for review, and that is when the answer matters.
on:
  pull_request:

# Read-only by default; no job here needs more.
permissions:
  contents: read

# Still worth grouping: pushing again mid-suite should abandon a run that is now
# testing a commit nobody cares about.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npm test
      - run: npm run build
        env:
          DEVELOPMENT_BUILD: ${{ github.sha }}

  # Kept separate from `test` so a browser failure is distinguishable at a
  # glance from a unit failure, and so the fast suite still reports when the
  # browser download or the dev server is what broke.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Build both images without pushing. vite.config.js reaches into dev/, and
  # .dockerignore allowlists what the build stage may COPY, so a new top-level
  # directory that is missing from the allowlist builds fine locally and only
  # fails in the image build. Catch that on the PR rather than at release time.
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: alpine, file: ./Dockerfile }
          - { name: debian, file: ./debian.dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.name }} (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
          push: false
          load: true
          tags: registry-ui-ci:${{ matrix.name }}
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}
      # The proxy upstream is unreachable on purpose: a 403 can only come from
      # nginx's own rule, and a 502 proves the request got past it.
      - name: Smoke test ${{ matrix.name }} (proxy rules and headers)
        run: |
          set -eu
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          run() {
            docker rm -f ui >/dev/null 2>&1 || true
            docker run -d --name ui -p 8080:80 -e NGINX_PROXY_PASS_URL=http://127.0.0.1:9 "$@" registry-ui-ci:${{ matrix.name }} >/dev/null
            for i in $(seq 1 30); do [ "$(code http://localhost:8080/)" = 200 ] && return 0; sleep 1; done
            docker logs ui; exit 1
          }
          expect() { [ "$1" = "$2" ] || { echo "FAIL: $3: expected $2, got $1"; docker logs ui; exit 1; }; }
          # The image's own HEALTHCHECK, on a faster cadence than the 30s default. The
          # upstream is down on purpose, so this also proves the check ignores the registry.
          healthy() {
            for i in $(seq 1 30); do
              [ "$(docker inspect --format '{{.State.Health.Status}}' ui)" = healthy ] && return 0
              sleep 1
            done
            echo "FAIL: container did not become healthy"; docker inspect --format '{{json .State.Health}}' ui; docker logs ui; exit 1
          }
          run --health-interval 2s --health-start-period 1s
          healthy
          expect "$(code -X DELETE http://localhost:8080/v2/x/manifests/sha256:0)" 403 "DELETE without DELETE_IMAGES"
          expect "$(code -X POST http://localhost:8080/v2/x/blobs/uploads/)" 502 "POST passes through"
          expect "$(code http://localhost:8080/v2/)" 502 "GET passes through"
          curl -sI http://localhost:8080/ | grep -qi '^x-content-type-options: nosniff' || { echo "FAIL: nosniff header missing"; exit 1; }
          curl -sI http://localhost:8080/ | grep -qi '^content-security-policy:' || { echo "FAIL: CSP header missing"; exit 1; }
          run -e DELETE_IMAGES=true
          expect "$(code -X DELETE http://localhost:8080/v2/x/manifests/sha256:0)" 502 "DELETE with DELETE_IMAGES=true"
          docker restart ui >/dev/null
          for i in $(seq 1 30); do [ "$(code http://localhost:8080/)" = 200 ] && break; sleep 1; done
          expect "$(code -X DELETE http://localhost:8080/v2/x/manifests/sha256:0)" 502 "DELETE after restart"
          docker rm -f ui >/dev/null
      # Opt-in non-root run (see "Running as non-root" in the README): the entrypoint
      # has to render index.html and the nginx config as the nginx user.
      - name: Smoke test ${{ matrix.name }} (non-root)
        run: |
          set -eu
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          expect() { [ "$1" = "$2" ] || { echo "FAIL: $3: expected $2, got $1"; docker logs ui; exit 1; }; }
          docker rm -f ui >/dev/null 2>&1 || true
          docker run -d --name ui --user 101:101 -p 8081:8080 \
            -e NGINX_LISTEN_PORT=8080 -e REGISTRY_URL=http://registry.ci.example:5000 \
            -e NGINX_PROXY_PASS_URL=http://127.0.0.1:9 \
            --health-interval 2s --health-start-period 1s \
            registry-ui-ci:${{ matrix.name }} >/dev/null
          for i in $(seq 1 30); do [ "$(code http://localhost:8081/)" = 200 ] && break; sleep 1; done
          expect "$(code http://localhost:8081/)" 200 "/ as non-root"
          curl -s http://localhost:8081/ | grep -q 'http://registry.ci.example:5000' || { echo "FAIL: REGISTRY_URL was not substituted"; docker logs ui; exit 1; }
          if curl -s http://localhost:8081/ | grep -q '\${REGISTRY_URL}'; then echo "FAIL: placeholder left in index.html"; exit 1; fi
          expect "$(code -X DELETE http://localhost:8081/v2/x/manifests/sha256:0)" 403 "DELETE without DELETE_IMAGES as non-root"
          expect "$(code http://localhost:8081/v2/)" 502 "GET passes through as non-root"
          for i in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' ui)" = healthy ] && break
            sleep 1
          done
          expect "$(docker inspect --format '{{.State.Health.Status}}' ui)" healthy "non-root health"
          docker restart ui >/dev/null
          for i in $(seq 1 30); do [ "$(code http://localhost:8081/)" = 200 ] && break; sleep 1; done
          expect "$(code http://localhost:8081/)" 200 "/ after non-root restart"
          docker rm -f ui >/dev/null
