name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

# Pushing to a branch that has a PR open fires both triggers, which ran the
# whole suite twice on the same commit. `head_ref` is the source branch on a
# pull_request event and empty on a push, where `ref_name` is the branch -- so
# both events land in one group and the second to start cancels the first.
# The same group also cancels a superseded run when you push again mid-suite.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npm test
      - run: npm run build
        env:
          DEVELOPMENT_BUILD: ${{ github.sha }}

  # Kept separate from `test` so a browser failure is distinguishable at a
  # glance from a unit failure, and so the fast suite still reports when the
  # browser download or the dev server is what broke.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
