name: Build and push main images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# Two merges in quick succession used to start two builds that both push
# `:main`, and whichever finished last won -- so a slow build of an older commit
# could quietly leave `:main` behind, with every job green. Queue instead.
#
# `cancel-in-progress: false` rather than true: a run cancelled midway can have
# pushed `:main` but not yet `:main-debian`, leaving the two variants on
# different commits. Letting the in-flight run finish costs a few minutes and
# guarantees both variants move together. GitHub keeps only the newest pending
# run, so a burst of merges still collapses to one follow-up build.
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx biome ci .
      - run: npm test
      # Same commands as the e2e job in ci.yml. Publishing is gated on it
      # because main has no branch protection requiring CI first.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push alpine
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            COMMIT_HASH=${{ github.sha }}
            VERSION_SUFFIX=main
          push: true
          tags: ghcr.io/yorch/docker-registry-ui:main
          cache-from: type=gha,scope=main-alpine
          cache-to: type=gha,mode=max,scope=main-alpine

      - name: Build and push debian
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./debian.dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            COMMIT_HASH=${{ github.sha }}
            VERSION_SUFFIX=main
          push: true
          tags: ghcr.io/yorch/docker-registry-ui:main-debian
          cache-from: type=gha,scope=main-debian
          cache-to: type=gha,mode=max,scope=main-debian
