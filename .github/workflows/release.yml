name: Release

# The glob below is only a coarse filter: it also matches 3.3.0-rc1. The first
# step of the job enforces the strict X.Y.Z form.
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write
  packages: write

# Per tag, so two releases cut close together never interleave their pushes to
# the shared moving tags (`:latest`, `:3`, `:3.1`). Never cancelled: a release
# is the one thing here that must complete once started, and a half-published
# set of tags is worse than a slow one.
concurrency:
  group: publish-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # A prerelease must never move :latest, :3 or :3.3. The ref goes through
      # env, never interpolated into the script body.
      - name: Require a strict X.Y.Z release tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$REF_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$REF_NAME' is not a strict X.Y.Z release tag"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # Full history: the ancestry check below needs origin/main.
          fetch-depth: 0
          persist-credentials: false

      - name: Require tag == package.json version and commit on main
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$REF_NAME" != "$PKG_VERSION" ]; then
            echo "::error::Tag '$REF_NAME' does not match package.json version '$PKG_VERSION'"
            exit 1
          fi
          git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null \
            || { echo "::error::origin/main was not fetched"; exit 1; }
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Compute version tags
        id: tags
        run: |
          FULL="${GITHUB_REF_NAME}"
          {
            echo "patch=$(echo "$FULL" | grep -o '^[0-9]*\.[0-9]*\.[0-9]*')"
            echo "minor=$(echo "$FULL" | grep -o '^[0-9]*\.[0-9]*')"
            echo "major=$(echo "$FULL" | grep -o '^[0-9]*')"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push alpine
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            COMMIT_HASH=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/yorch/docker-registry-ui:latest
            ghcr.io/yorch/docker-registry-ui:${{ steps.tags.outputs.major }}
            ghcr.io/yorch/docker-registry-ui:${{ steps.tags.outputs.minor }}
            ghcr.io/yorch/docker-registry-ui:${{ steps.tags.outputs.patch }}
          cache-from: type=gha,scope=release-alpine
          cache-to: type=gha,mode=max,scope=release-alpine

      - name: Build and push debian
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./debian.dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            COMMIT_HASH=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/yorch/docker-registry-ui:debian
            ghcr.io/yorch/docker-registry-ui:latest-debian
            ghcr.io/yorch/docker-registry-ui:${{ steps.tags.outputs.major }}-debian
            ghcr.io/yorch/docker-registry-ui:${{ steps.tags.outputs.minor }}-debian
            ghcr.io/yorch/docker-registry-ui:${{ steps.tags.outputs.patch }}-debian
          cache-from: type=gha,scope=release-debian
          cache-to: type=gha,mode=max,scope=release-debian

      # Last on purpose: a failed image push must not leave a published release
      # without images. Uses the API with GITHUB_TOKEN, not the git credential,
      # so persist-credentials: false does not affect it.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
