name: Release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write
  packages: write

# Per tag, so two releases cut close together never interleave their pushes to
# the shared moving tags (`:latest`, `:3`, `:3.1`). Never cancelled: a release
# is the one thing here that must complete once started, and a half-published
# set of tags is worse than a slow one.
concurrency:
  group: publish-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npm test

      - name: Compute version tags
        id: tags
        run: |
          FULL="${GITHUB_REF_NAME}"
          echo "patch=$(echo "$FULL" | grep -o '^[0-9]*\.[0-9]*\.[0-9]*')" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$FULL" | grep -o '^[0-9]*\.[0-9]*')" >> "$GITHUB_OUTPUT"
          echo "major=$(echo "$FULL" | grep -o '^[0-9]*')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push alpine
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            COMMIT_HASH=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/yorch/docker-registry-ui:latest
            ghcr.io/yorch/docker-registry-ui:${{ steps.tags.outputs.major }}
            ghcr.io/yorch/docker-registry-ui:${{ steps.tags.outputs.minor }}
            ghcr.io/yorch/docker-registry-ui:${{ steps.tags.outputs.patch }}
          cache-from: type=gha,scope=release-alpine
          cache-to: type=gha,mode=max,scope=release-alpine

      - name: Build and push debian
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./debian.dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            COMMIT_HASH=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/yorch/docker-registry-ui:debian
            ghcr.io/yorch/docker-registry-ui:latest-debian
            ghcr.io/yorch/docker-registry-ui:${{ steps.tags.outputs.major }}-debian
            ghcr.io/yorch/docker-registry-ui:${{ steps.tags.outputs.minor }}-debian
            ghcr.io/yorch/docker-registry-ui:${{ steps.tags.outputs.patch }}-debian
          cache-from: type=gha,scope=release-debian
          cache-to: type=gha,mode=max,scope=release-debian
