server {
    listen       80;
    server_name  localhost;
#r    resolver ${NGINX_RESOLVER}; # This is for docker container name resolver
    # charset koi8-r;
    # access_log  /var/log/nginx/host.access.log  main;

    # disable any limits to avoid HTTP 413 for large image uploads and 400 on large headers (eg: cookie)
    client_max_body_size 0;
    client_body_buffer_size     32k;
    client_header_buffer_size   8k;
    large_client_header_buffers 8 64k;

    # required to avoid HTTP 411: see Issue #1486 (https://github.com/moby/moby/issues/1486)
    chunked_transfer_encoding on;
    # required for strict SNI checking (originally Joxit/docker-registry-ui#70)
    proxy_ssl_server_name on;
    proxy_buffering off;
    # Fix push and pull of large images (originally Joxit/docker-registry-ui#282)
    proxy_request_buffering off; 
    proxy_ignore_headers "X-Accel-Buffering";

    # Security headers. Declared once, at server level: nginx only inherits
    # add_header from the enclosing level when a block declares none of its own, so
    # if a location below ever gains an add_header it must repeat these lines.
    # The entrypoint fills in the policy (or removes the CSP and X-Frame-Options
    # lines) from CONTENT_SECURITY_POLICY -- see the README.
    add_header Content-Security-Policy "${CONTENT_SECURITY_POLICY}" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

#!    location /v2 {
#!        # Do not allow connections from docker 1.5 and earlier
#!        # docker pre-1.6.0 did not properly set the user agent on ping, catch "Go *" user agents
#!        if ($http_user_agent ~ "^(docker\/1\.(3|4|5(?!\.[0-9]-dev))|Go ).*$" ) {
#!            return 404;
#!        }
#!        # Without DELETE_IMAGES the UI only hides its delete buttons; this is what
#!        # actually refuses writes. The entrypoint enables the next line unless
#!        # DELETE_IMAGES=true. (GET also allows HEAD.)
#!d        limit_except GET HEAD OPTIONS { deny all; }
#!        proxy_http_version 1.1;
#!        ${NGINX_PROXY_HEADERS}
#!        ${NGINX_PROXY_PASS_HEADERS}
#r        set $registry_server "${NGINX_PROXY_PASS_URL}";
#r        proxy_pass $registry_server;
#!r       proxy_pass ${NGINX_PROXY_PASS_URL};
#!    }

    # error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
